##############################################################################
# Javier Pena - website configuration
# Filled in from your CV. Two things still need you:
#   1. Replace USERNAME (2 places) with your GitHub username.
#   2. Check the homepage text below sounds like you.
# Indentation must be SPACES, never tabs.
##############################################################################

# No square brackets in this line - a bracket here breaks the whole build.
baseURL: "https://javierpenaecon.github.io/"

title: Javier Pena
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Research
          url: papers/
          weight: 1
        - name: Teaching
          url: courses/
          weight: 2
        - name: About
          url: cv/
          weight: 3
        - name: News
          url: news/
          weight: 4

params:
    description: "Javier Pena is a PhD candidate in economics at the University of Hohenheim, working on empirical macroeconomics, carbon pricing and financial econometrics."
    author: Javier Pena
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: [papers, courses]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true

    # THE HOMEPAGE. <br> is a line break, **word** makes bold.
    profileMode:
          enabled: true
          title: Javier Pena
          subtitle: "I am a PhD candidate in economics at the **University of Hohenheim**, in the Department of Business Mathematics and Data Science. <br> <br> My research is in **empirical macroeconomics** and **financial econometrics**. I work on the macroeconomic effects of **carbon pricing**, on **identification in structural VAR models**, and on the behaviour of safe haven assets. In 2025 I was a PhD intern in the Macroeconomic Analysis and Projections Division of the **Deutsche Bundesbank**."
          imageUrl: picture.jpg
          imageWidth: 160
          imageHeight: 160
          imageTitle: Javier Pena
          buttons:
            - name: Research
              url: papers/
            - name: Teaching
              url: courses/
            - name: About
              url: cv/
            - name: News
              url: news/

    socialIcons:
        # Put your trimmed CV in static/cv.pdf, then uncomment these two lines.
        # - name: CV
        #   url: cv.pdf
        - name: Email
          url: "mailto:javier.pena@uni-hohenheim.de"
        # - name: Google Scholar
        #   url: "https://scholar.google.com/citations?user=YOUR_ID"
        - name: GitHub
          url: "https://github.com/javierpenaEcon"

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: Javier Pena
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
