##############################################################################
# Javier Pena - website configuration
# Indentation must be SPACES, never tabs.
# Pages live in content/ as about.md, research.md, teaching.md.
##############################################################################

# A square bracket in this line breaks the whole build.
baseURL: "https://javierpenaecon.github.io/"

title: Javier Pena
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

menu:
    main:
        - name: About
          url: about/
          weight: 1
        - name: Research
          url: research/
          weight: 2
        - name: Teaching
          url: teaching/
          weight: 3

params:
    description: "Javier Pena, PhD candidate in economics at the University of Hohenheim."
    author: Javier Pena
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true

    # THE HOMEPAGE. <br> is a line break, **word** makes bold.
    profileMode:
          enabled: true
          title: Javier Pena
          subtitle: "I am a PhD candidate in economics at the **University of Hohenheim**. <br> <br> I work on empirical macroeconomics, financial econometrics and time series econometrics."
          # Photo: save a square picture.jpg in static/, then uncomment these 4 lines.
          # imageUrl: picture.jpg
          # imageWidth: 160
          # imageHeight: 160
          # imageTitle: Javier Pena
          buttons:
            - name: About
              url: about/
            - name: Research
              url: research/
            - name: Teaching
              url: teaching/

    socialIcons:
        # Put your trimmed CV in static/cv.pdf, then uncomment these two lines.
        # - name: CV
        #   url: cv.pdf
        - name: Email
          url: "mailto:javier.pena@uni-hohenheim.de"
        # - name: Google Scholar
        #   url: "https://scholar.google.com/citations?user=YOUR_ID"
        - name: GitHub
          url: "https://github.com/javierpenaEcon"
        - name: LinkedIn
          url: "https://www.linkedin.com/in/javier-pena-9a85bb19a/"

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: Javier Pena
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
